name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install linters
        run: brew install swiftformat swiftlint
      - name: Lint and platform-neutrality checks
        run: Scripts/lint.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Validate dependencies (no remote packages expected)
        run: |
          cd Packages/SpatialBridgeKit
          swift package resolve
          swift package show-dependencies --format json | tee deps.json
          test "$(python3 -c 'import json;print(len(json.load(open("deps.json"))["dependencies"]))')" = "0"
      - name: Unit + integration tests
        run: Scripts/test-packages.sh
      - name: Golden vectors unchanged
        # VectorExportTests run in check mode by default; this also catches untracked vector files.
        run: |
          git diff --exit-code Conformance/vectors
          test -z "$(git status --porcelain Conformance/vectors)"

  apps:
    runs-on: macos-26
    env:
      SB_UNSIGNED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build iOS (simulator)
        run: Scripts/build-ios.sh simulator
      - name: Build iOS (device, unsigned)
        run: Scripts/build-ios.sh device
      - name: Build macOS
        run: Scripts/build-macos.sh build
      - name: Static analysis
        run: |
          source Scripts/_common.sh
          xcb -scheme SpatialBridge-macOS -destination 'platform=macOS' analyze

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/SpatialBridge-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Core tests, sb-jvm, app build, unit tests and lint
        run: ./gradlew --no-daemon :core:test :cli:installDist :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Release APK (minified, debug-signed for testing)
        run: ./gradlew --no-daemon :app:assembleRelease -PsbDebugSignRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialBridge-Android-apk
          path: Apps/SpatialBridge-Android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: Apps/SpatialBridge-Android/*/build/reports/

  dotnet-core:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: Apps/SpatialBridge-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test tests/SpatialBridge.Core.Tests -c Release
      - name: Platform tests (non-Windows subset; [WindowsFact] tests skip)
        run: dotnet test tests/SpatialBridge.Platform.Windows.Tests -c Release
      - name: Format check
        run: |
          status=0
          for p in src/SpatialBridge.Core src/SpatialBridge.Cli tests/SpatialBridge.Core.Tests tests/SpatialBridge.Platform.Windows.Tests; do
            dotnet format "$p" --verify-no-changes || status=1
          done
          exit $status

  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: Apps/SpatialBridge-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/SpatialBridge.App/SpatialBridge.App.csproj -r win-x64 -p:Platform=x64
      - name: Build WinUI app (x64)
        run: dotnet build src/SpatialBridge.App/SpatialBridge.App.csproj -c Release -p:Platform=x64 -r win-x64 -warnaserror
      - name: Core tests
        run: dotnet test tests/SpatialBridge.Core.Tests -c Release
      - name: Platform tests
        run: dotnet test tests/SpatialBridge.Platform.Windows.Tests -c Release
      - name: Tray smoke test
        run: ../../Scripts/build-windows.ps1 smoke Release
      - name: Publish release build (x64, self-contained)
        run: ../../Scripts/build-windows.ps1 publish Release x64
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialBridge-Windows-x64
          path: |
            build/release/SpatialBridge-Windows-*-x64.zip
            build/release/SpatialBridge-Windows-*-x64.zip.sha256

  interop:
    needs: packages
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Loopback interop matrix
        run: Scripts/interop.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-results
          path: |
            Conformance/interop/results.json
            Conformance/interop/logs/
          if-no-files-found: warn

  release-artifacts:
    # Signed artifacts need secrets (Developer ID cert, notarytool profile) that must be
    # configured in the repository settings; see docs/Release/RELEASE.md.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, packages, apps]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
      - name: Archive
        run: Scripts/archive-macos.sh build/release
      - name: Notarize
        env:
          SB_NOTARY_PROFILE: ci
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ci --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          Scripts/notarize-macos.sh build/release/SpatialBridge-macOS.app
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialBridge-macOS
          path: build/release/SpatialBridge-macOS.zip
